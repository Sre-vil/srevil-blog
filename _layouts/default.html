<!doctype html>
{%- assign cur_lang = page.lang | default: 'ko' -%}
<html lang="{% if cur_lang == 'en' %}en{% else %}ko{% endif %}">
<head>
{% include head.html %}
</head>
<body class="layout-{{ page.layout }}">
<canvas id="bgstars" aria-hidden="true"></canvas>
{% if page.layout == 'home' %}{% include intro.html %}{% endif %}
{% include header.html %}
<main id="content">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/night.js' | relative_url }}"></script>
{%- if page.lg_guide %}
<script src="{{ '/assets/js/lg-guide.js' | relative_url }}" defer></script>
{%- endif %}
</body>
</html>
