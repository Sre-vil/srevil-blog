# Srevil Blog — Night Log (custom Jekyll theme, GitHub Pages)

lang: ko-KR
timezone: Asia/Seoul

title: Srevil Blog
tagline: 기록하고 정리하는 블로그
description: >-
  Srevil의 기록과 정리를 담은 블로그입니다.

url: "https://srevil.com"
baseurl: ""

author:
  name: Srevil

github:
  username: Sre-vil

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM

permalink: /posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
